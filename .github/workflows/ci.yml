name: HVAC CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# ---------------------------------------------------------
# REQUIRED: Grants GitHub Actions permission to draw the UI
# ---------------------------------------------------------
permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write
# ---------------------------------------------------------

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: posgres
          POSTGRES_DB: hvac_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests with Coverage and Reporting
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test_user 
          DB_PASSWORD: posgres
          DB_NAME: hvac_db
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Tells jest-junit exactly where to put the XML file
          JEST_JUNIT_OUTPUT_DIR: ./reports
          JEST_JUNIT_OUTPUT_NAME: test-report.xml
        # Runs the coverage script AND generates the XML file for the UI
        run: npm run test:coverage -- --ci --reporters=default --reporters=jest-junit

      # 👇 THIS CREATES THE EXACT UI YOU SHOWED IN YOUR SCREENSHOT 👇
      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() # Runs even if tests fail so you can see what broke
        with:
          name: Jest Test Results
          files: "reports/test-report.xml"